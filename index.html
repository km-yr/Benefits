  { icon:"🚌", color:"#f0faff", iconBg:"#cce8f8", title:"Dofinansowanie Dojazdów", short:"Wsparcie kosztów dojazdu do pracy.", desc:"Opis do uzupełnienia.", steps:["Krok do uzupełnienia."], link:"#", linkLabel:"", contact:"Kontakt: hr@firma.pl" },
  { icon:"❤️", color:"#fff0f0", iconBg:"#ffd5d5", title:"Inicjatywy Dobroczynne", short:"Pomagaj razem z nami — działaj dla dobra innych.", desc:"Opis do uzupełnienia.", steps:["Krok do uzupełnienia."], link:"#", linkLabel:"", contact:"Kontakt: hr@firma.pl" }
];

/* ===== Render kafelków ===== */
const grid = document.getElementById('grid');
benefits.forEach((b, i) => {
  const card = document.createElement('button');
  card.className = 'card';
  card.type = 'button';
  card.style.background = b.color;
  card.innerHTML = `
    <div class="icon" style="background:${b.iconBg}">${b.icon}</div>
    <h3>${b.title}</h3>
    <p>${b.short}</p>
    <div class="arrow">Dowiedz się więcej →</div>`;
  card.addEventListener('click', () => openModal(i));
  grid.appendChild(card);
});

/* ===== Modal ===== */
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');

function openModal(i) {
  const b = benefits[i];
  const icon = document.getElementById('m-icon');
  icon.textContent = b.icon;
  icon.style.background = b.iconBg;
  document.getElementById('m-title').textContent = b.title;
  const descs = Array.isArray(b.desc) ? b.desc : [b.desc];
  document.getElementById('m-desc').innerHTML = descs.map(d => `<p>${d}</p>`).join('');
  document.getElementById('m-steps').innerHTML = b.steps.map(s => `<li>${s}</li>`).join('');
  const links = b.links || [{ url: b.link, label: b.linkLabel }];
  document.getElementById('m-links').innerHTML = links
    .filter(l => l.url && l.url !== '#')
    .map(l => `<a class="m-link" href="${l.url}" target="_blank" rel="noopener">🔗 ${l.label || 'Więcej informacji'}</a>`)
    .join('');
  const contacts = Array.isArray(b.contact) ? b.contact : (b.contact ? [b.contact] : []);
  document.getElementById('m-contact').innerHTML = contacts.map(c => `<div>${c}</div>`).join('');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  modal.scrollTop = 0;
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
